name: sigrid-pullrequest
on:
  pull_request:

jobs:
  sigridci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Replaces the clone + python script
      - name: Run Sigrid CI
        uses: Software-Improvement-Group/sigridci@v2
        with:
          customer: hogent
          system: petanque-team-3
          source: .
          # publishonly is false by default for PRs (we want feedback, not publish)
        env:
          SIGRID_CI_TOKEN: ${{ secrets.SIGRID_CI_TOKEN }}  # or SIGRID_API_KEY if that's your secret name

      - name: Save Sigrid CI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          path: sigrid-ci-output/**/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Sigrid pull request feedback
        if: always()
        uses: mshick/add-pr-comment@v2
        with:
          message-id: sigrid
          message-path: sigrid-ci-output/feedback.md
