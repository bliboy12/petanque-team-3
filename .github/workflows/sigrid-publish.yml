name: Publish to Sigrid
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sigridci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@main
        with:
          customer: hogent
          system: petanque-team-3
        env:
          SIGRID_CI_TOKEN: ${{ secrets.SIGRID_API_KEY }}
