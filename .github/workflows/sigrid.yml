name: Sigrid Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sigrid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Sigrid CLI
        run: pip install sigridci

      - name: Run Sigrid publish
        env:
          SIGRID_API_KEY: ${{ secrets.SIGRID_API_KEY }}
        run: |
          sigridci publish \
            --customer hogent \
            --system petanque \
            --source . \
            --description "Publish via GitHub Actions"
